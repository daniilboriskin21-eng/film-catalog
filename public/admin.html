<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Добавить фильм - КиноПолка</title>
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <script src="./assets/js/admin.js" type="module"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="./index.html">КиноПолка</a>

      <button class="logout-button" type="button" hidden>Выйти</button>
    </header>

    <main class="main-content">
      <h1 class="headline">Добавить фильм</h1>

      <p class="auth-status" role="status">Проверяем авторизацию…</p>

      <form class="movie-form" hidden>
        <div class="form-field">
          <label for="title">Название фильма:</label>
          <input
            class="form-input"
            type="text"
            id="title"
            name="title"
            required
          />
        </div>

        <div class="form-field">
          <label for="year">Год выпуска:</label>
          <input
            class="form-input"
            type="number"
            id="year"
            name="year"
            required
          />
        </div>

        <div class="form-field">
          <label for="genre">Жанр:</label>
          <input
            class="form-input"
            type="text"
            id="genre"
            name="genre"
            required
          />
        </div>

        <div class="form-field">
          <label for="rating">Рейтинг:</label>
          <input
            class="form-input"
            type="number"
            id="rating"
            name="rating"
            min="0"
            max="10"
            step="0.1"
            required
          />
        </div>

        <div class="form-field">
          <label for="poster">Путь к постеру:</label>
          <input
            class="form-input"
            type="text"
            id="poster"
            name="poster"
            required
          />
        </div>

        <div class="form-field">
          <label for="description">Описание:</label>
          <textarea
            class="form-input"
            id="description"
            name="description"
            rows="5"
            required
          ></textarea>
        </div>

        <button class="movie-form__submit" type="submit">Добавить фильм</button>
        <p class="form-status" role="status"></p>
        <a class="created-movie-link" hidden>Открыть фильм</a>
      </form>

      <section class="admin-movies" hidden>
        <h2 class="admin-movies__headline">Управление фильмами</h2>
        <p class="admin-movies__status" role="status"></p>
        <ul class="admin-movies__list"></ul>

        <template class="admin-movie-template">
          <li class="admin-movie">
            <h3 class="admin-movie__title">
              <a class="admin-movie__link"></a>
            </h3>
            <span class="admin-movie__year"></span>
            <span class="admin-movie__genre"></span>

            <span class="admin-movie__actions">
              <a class="admin-movie__edit-link">Редактировать</a>
              <button class="admin-movie__delete" type="button">Удалить</button>
            </span>
          </li>
        </template>
      </section>
    </main>

    <footer class="site-footer">
      <p class="site-footer__text">КиноПолка · Учебный проект</p>
    </footer>
  </body>
</html>
