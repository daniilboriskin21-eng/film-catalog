<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Редактировать фильм - КиноПолка</title>
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <script src="./assets/js/edit_movie.js" type="module"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="./index.html">КиноПолка</a>

      <button class="logout-button" type="button" hidden>Выйти</button>
    </header>

    <main class="main-content">
      <h1 class="headline">Редактировать фильм</h1>
      <a class="back-link" href="./admin.html">Назад к управлению фильмами</a>

      <p class="auth-status" role="status">Проверяем авторизацию…</p>

      <form class="movie-form" autocomplete="off" hidden>
        <div class="form-field">
          <label for="title">Название фильма:</label>
          <input
            class="form-input"
            type="text"
            id="title"
            name="title"
            required
          />
        </div>

        <div class="form-field">
          <label for="year">Год выпуска:</label>
          <input
            class="form-input"
            type="number"
            id="year"
            name="year"
            required
          />
        </div>

        <div class="form-field">
          <label for="genre">Жанр:</label>
          <input
            class="form-input"
            type="text"
            id="genre"
            name="genre"
            required
          />
        </div>

        <div class="form-field">
          <label for="rating">Рейтинг:</label>
          <input
            class="form-input"
            type="number"
            id="rating"
            name="rating"
            min="0"
            max="10"
            step="0.1"
            required
          />
        </div>

        <div class="form-field">
          <label for="poster">Путь к постеру:</label>
          <input
            class="form-input"
            type="text"
            id="poster"
            name="poster"
            required
          />
        </div>

        <div class="form-field">
          <label for="description">Описание:</label>
          <textarea
            class="form-input"
            id="description"
            name="description"
            rows="5"
            required
          ></textarea>
        </div>

        <button class="movie-form__submit" type="submit">Сохранить изменения</button>
      </form>

      <p class="form-status" role="status"></p>
    </main>

    <footer class="site-footer">
      <p class="site-footer__text">КиноПолка · Учебный проект</p>
    </footer>
  </body>
</html>
